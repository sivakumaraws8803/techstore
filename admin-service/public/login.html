<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TechStore Admin | Sign in</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand-mark">TS</div>
      <p class="eyebrow">TECHSTORE MANAGEMENT</p>
      <h1>Admin sign in</h1>
      <p class="muted">Sign in with your existing TechStore owner account.</p>
      <form id="login-form">
        <label for="username">Username or email</label>
        <input id="username" name="username" autocomplete="username" required maxlength="160">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button primary full" type="submit">Sign in to dashboard</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-foot">Authorized administrators only</p>
    </section>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
